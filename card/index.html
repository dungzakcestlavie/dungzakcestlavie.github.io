<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="robots" content="noindex, nofollow">
<title>DUNGZAK CESTLAVIE — 등작 燈酌</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap');

  :root{
    --bg:#e9e7e2;
    --card:#fbfaf8;
    --ink:#141414;
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }

  html,body{
    margin:0;
    padding:0;
    height:100%;
    background:var(--bg);
    color:var(--ink);
    font-family:'Noto Sans KR', sans-serif;
  }

  body{
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    overflow:hidden;
  }

  .stage{
    width:340px;
    max-width:90vw;
    aspect-ratio: 1.6 / 1;
    perspective: 1400px;
  }

  .card{
    position:relative;
    width:100%;
    height:100%;
    transform-style: preserve-3d;
    transition: transform 0.7s cubic-bezier(0.65, 0, 0.35, 1);
    cursor:pointer;
  }

  .card.flipped{
    transform: rotateY(180deg);
  }

  .face{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    -webkit-backface-visibility:hidden;
    backface-visibility:hidden;
    background:var(--card);
    border-radius:6px;
    box-shadow:
      0 1px 2px rgba(20,20,20,0.06),
      0 12px 28px rgba(20,20,20,0.14),
      0 2px 6px rgba(20,20,20,0.08);
    padding:26px 28px;
    display:flex;
    flex-direction:column;
  }

  .face.back{
    transform: rotateY(180deg);
  }

  /* ---------- FRONT ---------- */

  .front-top{
    display:flex;
    align-items:baseline;
    gap:10px;
    flex-wrap:wrap;
  }

  .mark-kr{
    font-family:'Noto Sans KR', sans-serif;
    font-weight:600;
    font-size:19px;
    letter-spacing:0.02em;
    color:var(--ink);
  }

  .mark-en{
    font-family:'Cormorant Garamond', serif;
    font-weight:500;
    font-size:14px;
    letter-spacing:0.14em;
    color:var(--ink);
    opacity:0.72;
    text-transform:uppercase;
  }

  .tagline{
    margin-top:auto;
    padding-top:18px;
    text-align:right;
    align-self:flex-end;
    width:100%;
  }

  .tagline-kr{
    font-family:'Noto Sans KR', sans-serif;
    font-weight:500;
    font-size:15px;
    color:var(--ink);
    letter-spacing:0.01em;
  }

  .tagline-en{
    margin-top:3px;
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-weight:400;
    font-size:12.5px;
    color:var(--ink);
    opacity:0.6;
    letter-spacing:0.03em;
  }

  .front-bottom{
    margin-top:auto;
    padding-top:20px;
    border-top:1px solid rgba(20,20,20,0.12);
    display:flex;
    flex-direction:column;
    gap:8px;
  }

  .contact-row{
    display:flex;
    align-items:baseline;
    gap:10px;
    font-family:'Noto Sans KR', sans-serif;
  }

  .contact-label{
    font-family:'Cormorant Garamond', serif;
    font-size:10px;
    font-weight:600;
    letter-spacing:0.16em;
    opacity:0.5;
    width:56px;
    flex-shrink:0;
    text-transform:uppercase;
  }

  .contact-row a{
    color:var(--ink);
    text-decoration:none;
    font-size:13px;
    font-weight:400;
    letter-spacing:0.01em;
    border-bottom:1px solid transparent;
    transition:border-color 0.2s ease;
    word-break:break-all;
  }

  .contact-row a:active{
    border-bottom-color: rgba(20,20,20,0.4);
  }

  /* ---------- BACK ---------- */

  .back{
    display:flex;
    flex-direction:column;
    justify-content:space-between;
  }

  .qr-block{
    display:flex;
    align-items:flex-start;
    gap:12px;
  }

  .qr-block.bottom-right{
    align-self:flex-end;
    flex-direction:row-reverse;
    text-align:right;
  }

  .qr-block img{
    width:64px;
    height:64px;
    display:block;
    border-radius:2px;
  }

  .qr-text{
    display:flex;
    flex-direction:column;
    justify-content:center;
    gap:2px;
    padding-top:2px;
  }

  .qr-label{
    font-family:'Cormorant Garamond', serif;
    font-size:10px;
    font-weight:600;
    letter-spacing:0.16em;
    opacity:0.5;
    text-transform:uppercase;
  }

  .qr-sublabel{
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-size:10.5px;
    font-weight:400;
    opacity:0.55;
  }

  .qr-url{
    font-family:'Noto Sans KR', sans-serif;
    font-size:12.5px;
    font-weight:500;
    color:var(--ink);
    text-decoration:none;
    border-bottom:1px solid transparent;
    margin-top:1px;
  }

  .qr-url:active{
    border-bottom-color: rgba(20,20,20,0.4);
  }

  .back-hint{
    text-align:center;
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-size:10px;
    opacity:0.32;
    letter-spacing:0.06em;
  }

  /* ---------- SAVE / SHARE ---------- */

  .wrap{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:16px;
  }

  .save-btn{
    display:flex;
    align-items:center;
    gap:6px;
    background:none;
    border:none;
    padding:6px 10px;
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-size:12.5px;
    letter-spacing:0.04em;
    color:var(--ink);
    opacity:0.55;
    cursor:pointer;
    transition:opacity 0.2s ease;
  }

  .save-btn:active{
    opacity:0.9;
  }

  .save-btn svg{
    width:13px;
    height:13px;
    flex-shrink:0;
  }

  .save-btn.busy{
    opacity:0.3;
    pointer-events:none;
  }

  .toast{
    position:fixed;
    left:50%;
    bottom:36px;
    transform:translateX(-50%) translateY(12px);
    background:var(--ink);
    color:var(--card);
    font-family:'Noto Sans KR', sans-serif;
    font-size:12.5px;
    padding:10px 18px;
    border-radius:20px;
    opacity:0;
    pointer-events:none;
    transition:opacity 0.25s ease, transform 0.25s ease;
    white-space:nowrap;
  }

  .toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
  }
</style>
</head>

      <path d="M12 3v12"/>
      <path d="M7 10l5 5 5-5"/>
      <path d="M5 19h14"/>
    </svg>
    <span id="saveBtnLabel">이미지 저장 · 공유</span>
  </button>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script>
    (function(){
      const card = document.getElementById('card');
      card.addEventListener('click', function(){
        card.classList.toggle('flipped');
      });

      const saveBtn = document.getElementById('saveBtn');
      const saveBtnLabel = document.getElementById('saveBtnLabel');
      const toastEl = document.getElementById('toast');
      let toastTimer = null;

      function showToast(msg){
        toastEl.textContent = msg;
        toastEl.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function(){
          toastEl.classList.remove('show');
        }, 2200);
      }

      saveBtn.addEventListener('click', async function(e){
        e.stopPropagation();
        if (saveBtn.classList.contains('busy')) return;
        saveBtn.classList.add('busy');
        const originalLabel = saveBtnLabel.textContent;
        saveBtnLabel.textContent = '이미지 생성 중...';

        try {
          const activeFace = card.classList.contains('flipped')
            ? card.querySelector('.face.back')
            : card.querySelector('.face.front');

          const canvas = await html2canvas(activeFace, {
            backgroundColor: '#fbfaf8',
            scale: 3,
            useCORS: true,
            onclone: function(clonedDoc, el){
              el.style.transform = 'none';
              el.style.position = 'static';
              el.style.boxShadow = 'none';
            }
          });

          canvas.toBlob(async function(blob){
            if (!blob) {
              showToast('이미지 생성에 실패했습니다');
              saveBtn.classList.remove('busy');
              saveBtnLabel.textContent = originalLabel;
              return;
            }

            const fileName = 'dungzak-card-' + (card.classList.contains('flipped') ? 'back' : 'front') + '.png';
            const file = new File([blob], fileName, { type: 'image/png' });

            const canUseShare = navigator.canShare && navigator.share &&
              (function(){ try { return navigator.canShare({ files: [file] }); } catch(err){ return false; } })();

            if (canUseShare) {
              try {
                await navigator.share({
                  files: [file],
                  title: 'DUNGZAK CESTLAVIE',
                  text: '등작 燈酌 — Digital Card'
                });
                showToast('공유 완료');
              } catch(err) {
                if (err && err.name !== 'AbortError') {
                  showToast('공유가 취소되었습니다');
                }
              }
            } else {
              const url = URL.createObjectURL(blob);
              const a = document.createElement('a');
              a.href = url;
              a.download = fileName;
              document.body.appendChild(a);
              a.click();
              document.body.removeChild(a);
              setTimeout(function(){ URL.revokeObjectURL(url); }, 3000);
              showToast('이미지가 저장되었습니다');
            }

            saveBtn.classList.remove('busy');
            saveBtnLabel.textContent = originalLabel;
          }, 'image/png');

        } catch(err) {
          showToast('오류가 발생했습니다');
          saveBtn.classList.remove('busy');
          saveBtnLabel.textContent = originalLabel;
        }
      });
    })();
  </script>
