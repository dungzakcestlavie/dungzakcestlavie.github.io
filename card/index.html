<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="robots" content="noindex, nofollow">
<title>DUNGZAK CESTLAVIE — 등작 燈酌</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500;1,600&display=swap');

  :root{
    --bg:#e9e7e2;
    --card:#fbfaf8;
    --ink:#141414;
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }

  html,body{
    margin:0;
    padding:0;
    height:100%;
    background:var(--bg);
    color:var(--ink);
    font-family:'Noto Sans KR', sans-serif;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
    text-rendering:optimizeLegibility;
  }

  body{
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    overflow:hidden;
  }

  .stage{
    width:510px;
    max-width:92vw;
    aspect-ratio: 1.6 / 1;
    perspective: 2000px;
  }

  .card{
    position:relative;
    width:100%;
    height:100%;
    transform-style: preserve-3d;
    transition: transform 0.7s cubic-bezier(0.65, 0, 0.35, 1);
    cursor:pointer;
  }

  .card.flipped{
    transform: rotateY(180deg);
  }

  .face{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    -webkit-backface-visibility:hidden;
    backface-visibility:hidden;
    transform:translateZ(0);
    -webkit-transform:translateZ(0);
    background:var(--card);
    border-radius:9px;
    box-shadow:
      0 1.5px 3px rgba(20,20,20,0.06),
      0 18px 42px rgba(20,20,20,0.14),
      0 3px 9px rgba(20,20,20,0.08);
    padding:clamp(12px, 4.2vw, 22px) clamp(24px, 8.24vw, 42px);
    display:flex;
    flex-direction:column;
  }

  .face.back{
    transform: rotateY(180deg) translateZ(0);
    -webkit-transform: rotateY(180deg) translateZ(0);
  }

  /* ---------- FRONT ---------- */

  .front-top{
    display:flex;
    align-items:baseline;
    gap:clamp(8px, 2.9vw, 15px);
    flex-wrap:wrap;
  }

  .mark-kr{
    font-family:'Noto Sans KR', sans-serif;
    font-weight:600;
    font-size:clamp(18px, 5.6vw, 28.5px);
    letter-spacing:0.02em;
    color:var(--ink);
    white-space:nowrap;
  }

  .mark-en{
    font-family:'Cormorant Garamond', serif;
    font-weight:600;
    font-size:clamp(15px, 5.9vw, 30px);
    letter-spacing:0.08em;
    color:var(--ink);
    opacity:0.88;
    text-transform:uppercase;
    white-space:nowrap;
  }

  .tagline{
    margin-top:clamp(8px, 3.1vw, 16px);
    padding-top:0;
    text-align:right;
    align-self:flex-end;
    width:100%;
  }

  .tagline-kr{
    font-family:'Noto Sans KR', sans-serif;
    font-weight:500;
    font-size:clamp(15px, 4.5vw, 23px);
    color:var(--ink);
    letter-spacing:0.01em;
  }

  .tagline-en{
    margin-top:clamp(2px, 1vw, 5px);
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-weight:600;
    font-size:clamp(14px, 4.3vw, 22px);
    color:var(--ink);
    opacity:0.92;
    letter-spacing:0.03em;
    white-space:nowrap;
  }

  .front-bottom{
    margin-top:auto;
    margin-bottom:clamp(8px, 3vw, 16px);
    padding-top:clamp(10px, 4vw, 20px);
    border-top:1px solid rgba(20,20,20,0.12);
    display:flex;
    flex-direction:column;
    gap:clamp(5px, 2vw, 10px);
  }

  .contact-row{
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    gap:2px;
    font-family:'Noto Sans KR', sans-serif;
  }

  .contact-label{
    font-family:'Cormorant Garamond', serif;
    font-size:clamp(8px, 2.1vw, 11px);
    font-weight:600;
    letter-spacing:0.16em;
    opacity:0.72;
    color:var(--ink);
    text-transform:uppercase;
  }

  .contact-row a{
    color:var(--ink);
    text-decoration:none;
    font-size:clamp(11px, 3.2vw, 16px);
    font-weight:500;
    letter-spacing:0.01em;
    border-bottom:1px solid transparent;
    transition:border-color 0.2s ease;
    word-break:break-all;
  }

  .contact-row a:active{
    border-bottom-color: rgba(20,20,20,0.4);
  }

  /* ---------- BACK ---------- */

  .back{
    display:flex;
    flex-direction:column;
    justify-content:space-between;
  }

  .qr-block{
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    gap:6px;
    max-width:80%;
    min-width:0;
  }

  .qr-block.bottom-right{
    align-self:flex-end;
    align-items:flex-end;
    text-align:right;
  }

  .qr-block img{
    width:60px;
    height:60px;
    display:block;
    border-radius:2px;
    image-rendering:-webkit-optimize-contrast;
    image-rendering:crisp-edges;
  }

  .qr-block a{
    display:block;
    line-height:0;
    cursor:pointer;
  }

  .qr-text{
    display:flex;
    flex-direction:column;
    gap:4px;
    max-width:100%;
  }

  .qr-label{
    font-family:'Cormorant Garamond', serif;
    font-size:clamp(10px, 2.6vw, 13px);
    font-weight:800;
    letter-spacing:0.18em;
    opacity:1;
    color:var(--ink);
    text-transform:uppercase;
    white-space:nowrap;
  }

  .qr-sublabel{
    font-family:'Cormorant Garamond', serif;
    font-style:normal;
    font-size:clamp(10px, 2.6vw, 13px);
    font-weight:800;
    letter-spacing:0.14em;
    opacity:1;
    color:var(--ink);
    margin-top:-3px;
    white-space:nowrap;
  }

  .qr-url{
    font-family:'Cormorant Garamond', serif;
    font-size:clamp(14px, 4vw, 20px);
    font-weight:800;
    letter-spacing:0.08em;
    color:var(--ink);
    text-decoration:none;
    border-bottom:1px solid transparent;
    margin-top:2px;
    white-space:nowrap;
  }

  .qr-url:active{
    border-bottom-color: rgba(20,20,20,0.4);
  }

  .back-hint{
    text-align:center;
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-size:15px;
    opacity:0.32;
    letter-spacing:0.06em;
  }

  /* ---------- FLIP HINT ---------- */

  .flip-hint{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;
    text-align:center;
    letter-spacing:0.04em;
  }

  .flip-hint-kr{
    font-family:'Noto Sans KR', sans-serif;
    font-size:20px;
    font-weight:500;
    color:var(--ink);
    opacity:0.72;
  }

  .flip-hint-divider{
    font-size:17px;
    opacity:0.4;
  }

  .flip-hint-en{
    font-family:'Noto Sans KR', sans-serif;
    font-style:normal;
    font-weight:500;
    font-size:20px;
    color:var(--ink);
    opacity:0.72;
  }

  /* ---------- SAVE / SHARE ---------- */

  .wrap{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:24px;
  }

  .save-btn{
    display:flex;
    align-items:center;
    gap:9px;
    background:none;
    border:none;
    padding:9px 15px;
    letter-spacing:0.02em;
    color:var(--ink);
    opacity:0.72;
    cursor:pointer;
    transition:opacity 0.2s ease;
  }

  .save-btn:active{
    opacity:0.9;
  }

  .save-btn svg{
    width:23px;
    height:23px;
    flex-shrink:0;
  }

  .save-btn.busy{
    opacity:0.3;
    pointer-events:none;
  }

  .save-btn-label{
    display:flex;
    align-items:center;
    gap:9px;
  }

  .save-btn-kr{
    font-family:'Noto Sans KR', sans-serif;
    font-size:21px;
    font-weight:500;
  }

  .save-btn-divider{
    font-size:20px;
    opacity:0.7;
  }

  .save-btn-en{
    font-family:'Noto Sans KR', sans-serif;
    font-style:normal;
    font-weight:500;
    font-size:21px;
  }

  .toast{
    position:fixed;
    left:50%;
    bottom:46px;
    transform:translateX(-50%) translateY(12px);
    background:var(--ink);
    color:var(--card);
    font-family:'Noto Sans KR', sans-serif;
    font-size:22px;
    padding:15px 27px;
    border-radius:30px;
    opacity:0;
    pointer-events:none;
    transition:opacity 0.25s ease, transform 0.25s ease;
    white-space:nowrap;
  }

  .toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
  }
</style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script>
    (function(){
      const card = document.getElementById('card');
      card.addEventListener('click', function(){
        card.classList.toggle('flipped');
      });

      const saveBtn = document.getElementById('saveBtn');
      const saveBtnKr = document.getElementById('saveBtnKr');
      const saveBtnEn = document.getElementById('saveBtnEn');
      const toastEl = document.getElementById('toast');
      let toastTimer = null;

      const LABEL_IDLE_KR = '이미지 저장 · 공유';
      const LABEL_IDLE_EN = 'Save & Share';
      const LABEL_BUSY_KR = '이미지 생성 중...';
      const LABEL_BUSY_EN = 'Generating...';
      const LABEL_READY_KR = '다시 탭하여 공유';
      const LABEL_READY_EN = 'Tap again to share';

      function setLabel(state){
        if (state === 'busy') { saveBtnKr.textContent = LABEL_BUSY_KR; saveBtnEn.textContent = LABEL_BUSY_EN; }
        else if (state === 'ready') { saveBtnKr.textContent = LABEL_READY_KR; saveBtnEn.textContent = LABEL_READY_EN; }
        else { saveBtnKr.textContent = LABEL_IDLE_KR; saveBtnEn.textContent = LABEL_IDLE_EN; }
      }

      function showToast(msg){
        toastEl.textContent = msg;
        toastEl.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function(){
          toastEl.classList.remove('show');
        }, 2600);
      }

      function blobToPromise(canvas){
        return new Promise(function(resolve){
          canvas.toBlob(function(blob){ resolve(blob); }, 'image/png');
        });
      }

      // Universal fallback: force a direct file download. Works reliably on
      // desktop/laptop browsers (Chrome, Edge, Firefox, Safari) and modern
      // mobile browsers alike.
      function downloadBlob(blob, fileName){
        try {
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = fileName;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
          showToast('이미지가 저장되었습니다 · Image saved');
          return true;
        } catch(err) {
          try {
            const url2 = URL.createObjectURL(blob);
            window.open(url2, '_blank');
            showToast('길게 눌러 이미지를 저장하세요 · Long-press the image to save');
            return true;
          } catch(err2) {
            showToast('저장에 실패했습니다 · Save failed');
            return false;
          }
        }
      }

      // Holds a prepared image while we wait for a second, fresh tap. Strict
      // browsers (iOS/iPadOS Safari especially) only allow navigator.share()
      // to run as a direct, synchronous continuation of a user gesture — any
      // async delay beforehand (like rendering the canvas) causes it to
      // silently fail. Splitting into two taps guarantees the actual
      // share() call happens inside a brand-new, untouched click event.
      let pendingShare = null;
      let pendingShareTimer = null;

      function clearPendingShare(){
        pendingShare = null;
        clearTimeout(pendingShareTimer);
        saveBtn.classList.remove('busy');
        setLabel('idle');
      }

      saveBtn.addEventListener('click', async function(e){
        e.stopPropagation();

        // Second tap: image is already prepared — call share() immediately,
        // synchronously within this fresh click, before any await happens.
        if (pendingShare) {
          const data = pendingShare;
          clearPendingShare();
          try {
            await navigator.share({
              files: [data.file],
              title: '등작 燈酌 DUNGZAK CESTLAVIE',
              text: data.shareText,
              url: data.cardUrl
            });
          } catch(err) {
            // The image was already downloaded during the first tap, so a
            // cancelled or failed share here isn't a problem worth
            // surfacing — the person already has the file either way.
          }
          return;
        }

        if (saveBtn.classList.contains('busy')) return;
        saveBtn.classList.add('busy');
        setLabel('busy');

        try {
          const activeFace = card.classList.contains('flipped')
            ? card.querySelector('.face.back')
            : card.querySelector('.face.front');

          const canvas = await html2canvas(activeFace, {
            backgroundColor: '#fbfaf8',
            scale: 3,
            useCORS: true,
            onclone: function(clonedDoc, el){
              // The back face carries its own compensating rotateY(180deg) so it
              // reads correctly once the parent .card is also flipped 180deg.
              // When capturing it in isolation we must neutralize BOTH the
              // face's own transform AND the parent card's transform — resetting
              // only the face left the card's rotation in effect on its own,
              // which mirrored the text in the saved image.
              const clonedCard = clonedDoc.getElementById('card');
              if (clonedCard) {
                clonedCard.style.transform = 'none';
                clonedCard.style.webkitTransform = 'none';
              }
              el.style.transform = 'none';
              el.style.webkitTransform = 'none';
              el.style.position = 'static';
              el.style.boxShadow = 'none';
            }
          });

          const blob = await blobToPromise(canvas);

          if (!blob) {
            showToast('이미지 생성에 실패했습니다 · Couldn\u2019t generate image');
            saveBtn.classList.remove('busy');
            setLabel('idle');
            return;
          }

          const fileName = 'dungzak-card-' + (card.classList.contains('flipped') ? 'back' : 'front') + '.png';
          const file = new File([blob], fileName, { type: 'image/png' });
          const cardUrl = 'https://dungzak.art/card';
          const shareText = '등작 燈酌 DUNGZAK CESTLAVIE — Digital Card\n' + cardUrl;

          // Always save the image to disk first, on every device — this is
          // the guaranteed part of "Save & Share".
          downloadBlob(blob, fileName);

          const canUseShare = navigator.canShare && navigator.share &&
            (function(){ try { return navigator.canShare({ files: [file] }); } catch(err){ return false; } })();

          if (canUseShare) {
            // Don't call share() yet — wait for the next tap so the call is
            // a fresh, synchronous user gesture (required by iOS/iPadOS
            // Safari; harmless everywhere else). The download above has
            // already happened regardless of whether this second tap occurs.
            pendingShare = { blob, fileName, file, shareText, cardUrl };
            saveBtn.classList.remove('busy');
            setLabel('ready');
            showToast('다시 탭하면 공유창이 열립니다 · Tap again to open share');
            pendingShareTimer = setTimeout(clearPendingShare, 20000);
          } else {
            saveBtn.classList.remove('busy');
            setLabel('idle');
          }

        } catch(err) {
          showToast('오류가 발생했습니다 · Something went wrong');
          saveBtn.classList.remove('busy');
          setLabel('idle');
        }
      });
    })();
  </script>

</body>
